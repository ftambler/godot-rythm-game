name: Deploy docs to GitHub Pages

# Publishes the documents/ folder (the GDD) as the project's GitHub Pages site.
on:
  push:
    branches:
      - main
    paths:
      - documents/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish instead of cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: documents

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
